<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Karina - Flores Amarillas Eternas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;500;600&display=swap');

    :root {
      --gold: #facc15;
      --gold-deep: #eab308;
      --brown: #451a03;
      --forest: #14532d;
      --forest-dark: #052e16;
      --cream: #fff9e6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      transition: background 1.4s ease;
    }

    body {
      cursor: crosshair;
      position: relative;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .interface {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px 28px;
      z-index: 10;
    }

    .card {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 25px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      text-align: center;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      max-width: 450px;
      pointer-events: auto;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
    }

    .music-btn {
      margin-top: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--gold);
      color: #854d0e;
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      border: 2px solid var(--gold-deep);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      pointer-events: auto;
    }

    .music-btn:hover {
      transform: translateY(-2px) scale(1.04);
      background: #fde047;
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.48);
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.2rem, 4vw, 3rem);
      margin: 0;
      color: #854d0e;
    }

    h3 {
      font-size: 0.92rem;
      color: #a16207;
      margin: 8px 0 0;
      font-weight: 500;
      letter-spacing: 0.7px;
    }

    p {
      color: var(--brown);
      font-size: 1rem;
      line-height: 1.5;
      margin-top: 18px;
      min-height: 3.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .counter {
      background: rgba(254, 243, 199, 0.82);
      color: #92400e;
      padding: 8px 18px;
      border-radius: 22px;
      font-weight: 700;
      font-size: 0.8rem;
      display: inline-block;
      margin-top: 12px;
      box-shadow: inset 0 0 0 1px rgba(146, 64, 14, 0.12);
    }

    .footer-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.8;
      text-align: center;
      padding-bottom: 4px;
    }

    #bubbleLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 15;
    }

    .memory-bubble {
      position: absolute;
      width: 92px;
      height: 92px;
      left: 0;
      top: 0;
      opacity: 0;
      transform: translate(-50%, 0) scale(0.7);
      animation: bubbleFloat 4.5s ease-out forwards;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.18));
      z-index: 20;
    }

    .memory-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      background: linear-gradient(135deg, #fff, #fef3c7);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.6);
    }

    @keyframes bubbleFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, 36px) scale(0.72);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -180px) scale(1.16);
      }
    }
  </style>
</head>
<body>
  <div class="interface">
    <div class="card" id="mainCard">
      <h1>Hola Karina...</h1>
      <h3>Estas flores no se marchitarán</h3>
      <p id="quote">"Haz clic en el suelo para plantar una semilla de alegría."</p>

      <a href="https://open.spotify.com/track/5wBBoVjoounI5e36oI8oZe?si=6958e12a31674094" target="_blank" class="music-btn">
        <span>🎵 Escuchar</span>
      </a>

      <div class="counter" id="flowerCount">Flores: 0</div>
    </div>

    <div class="footer-text">Toca para crear vida en tu jardín</div>
  </div>

  <div id="bubbleLayer"></div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const quoteEl = document.getElementById('quote');
    const countEl = document.getElementById('flowerCount');
    const bubbleLayer = document.getElementById('bubbleLayer');

    let width, height;
    let mouseX = 0, mouseY = 0;
    let flowers = [];
    let particles = [];
    let stars = [];
    let time = 0;
    let clickCount = 0;

    const imageFiles = ['darkside.jpg', 'dinky.png', 'grogu.png', 'ludo.png', 'tie.png', 'vader.png'];
    const bubbleTriggerEvery = 3;

    const quotes = [
      "Su chat es de las mejores cosas que alegran el dia.",
      "Que estas flores iluminen su día joven.",
      "Un detalle amarillo para un corazón de oro.",
      "Cada clic es un pensamiento positivo para ti.",
      "Usted hace que el mundo florezca.",
      "Cuidaré este jardín tanto como nuestra amistad.",
      "Brillas con luz propia.",
      "Tu sonrisa es el sol de estas flores.",
      "Eres magia en un mundo ordinario.",
      "Florecer requiere tiempo, y usted es hermosa.",
      "Gracias por ser usted, especial, atenta y inteligente.",
      "Tu luz es capaz de iluminar el día más oscuro.",
      "Hoy es un buen día para ser feliz.",
      "Nunca dejes de brillar, el mundo te necesita.",
      "Eres más fuerte de lo que crees.",
      "La vida es mejor con personas como usted cerca.",
      "Un pequeño detalle para un gran corazón.",
      "Usted es pura inspiración.",
      "Cada pétalo guarda un deseo para ti.",
      "Donde pones el ojo, pones alegría.",
      "Eres la razón de muchas sonrisas hoy.",
      "Sigue creciendo, el cielo es el límite.",
      "Tu energía es contagiosa y brillante.",
      "Eres única, inteligente y atenta y eso es tu superpoder.",
      "Que nunca te falten flores en el camino.",
      "Eres paz en medio de cualquier tormenta.",
      "Mereces todo lo bueno que te pase.",
      "Gracias por existir y ser tan especial.",
      "Tu amistad es un tesoro invaluable.",
      "Eres el girasol más lindo de este jardín.",
      "Que la felicidad te encuentre hoy y siempre.",
      "Un jardín eterno para una persona inolvidable.",
      "Que la música de hoy sea tu risa.",
      "Brillas, Karina, con una fuerza que solo es reconocible en muy pocas personas.",
      "Su gusto musical es increible y me gustaria seguir conociendolo.",
      "Es atenta con sus seres queridos y eso es un don que vino del cielo",
      "Dios se encargo de darle las mejores cualidades a las mejores personas y usted fue una de ellas",
      "Espero que no se moleste, pero pues habia que darle flores amarilas",
      "Cada que usted sonrie es una alegria mas en la vida de la gente que la rodea",
      "De hecho, usted es de las personas que valen todo para tener cerca",
      "Gracias a Dios pude conocerla mejor y me equivoque con lo que dije que parecia que no le caia bien la gente",
      "Me sorprende cada dia mas lo buena que es con las personas que tiene cerca.",
      "Todas los dias su playlist me motiva en el gym, gracias por eso",
      "Gracias por ser como es, porfa nunca cambie.",
      "Todos los dias se le extrana, un poco mas que ayer pero un poco menos que manana",
      "Se merece lo mejor siempre, por lo magnifica persona que es usted joven.",
    ];

    class Flower {
      constructor(x) {
        this.x = x;
        this.stemHeight = Math.random() * 80 + 200;
        this.currentHeight = 0;
        this.targetHeight = this.stemHeight;
        this.growthSpeed = 0.025;
        this.angle = 0;
        this.offset = Math.random() * 2000;
        this.petalCount = Math.floor(Math.random() * 3) + 14;
        this.hue = 46 + Math.random() * 8;

        this.leaves = [
          { y: 0.4, side: 1, size: 25 + Math.random() * 10 },
          { y: 0.65, side: -1, size: 25 + Math.random() * 10 }
        ];

        this.seeds = Array.from({ length: 25 }, () => ({
          r: Math.random() * 15,
          a: Math.random() * Math.PI * 2
        }));
      }

      update() {
        if (this.currentHeight < this.targetHeight) {
          this.currentHeight += (this.targetHeight - this.currentHeight) * this.growthSpeed;
        }

        const wave = Math.sin(time * 0.001 + this.offset) * 0.12;
        const mouseFlex = (mouseX - this.x) / width * 0.25;
        this.angle = wave + mouseFlex;
      }

      draw() {
        const headX = this.x + Math.sin(this.angle) * this.currentHeight;
        const headY = (height - 80) - Math.cos(this.angle) * this.currentHeight;

        ctx.beginPath();
        ctx.moveTo(this.x, height - 80);
        const stemGrad = ctx.createLinearGradient(this.x, height, headX, headY);
        stemGrad.addColorStop(0, '#1a2e05');
        stemGrad.addColorStop(1, '#4d7c0f');
        ctx.strokeStyle = stemGrad;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.quadraticCurveTo(this.x + (this.angle * 15), height - 80 - this.currentHeight / 2, headX, headY);
        ctx.stroke();

        this.leaves.forEach(leaf => {
          const leafYRatio = leaf.y;
          if (this.currentHeight / this.targetHeight > leafYRatio) {
            const prog = (this.currentHeight / this.targetHeight - leafYRatio) * 4;
            const sSize = Math.min(leaf.size, leaf.size * prog);
            const lx = this.x + Math.sin(this.angle) * (this.currentHeight * leafYRatio);
            const ly = (height - 80) - Math.cos(this.angle) * (this.currentHeight * leafYRatio);
            this.drawLeaf(lx, ly, this.angle + (0.8 * leaf.side), sSize);
          }
        });

        if (this.currentHeight > 50) {
          ctx.save();
          ctx.translate(headX, headY);
          const headScale = this.currentHeight / this.targetHeight;
          ctx.scale(headScale, headScale);
          ctx.rotate(this.angle * 0.4);

          ctx.shadowBlur = 15;
          ctx.shadowColor = 'rgba(0,0,0,0.1)';

          this.drawPetalLayer(this.petalCount, 60, `hsl(${this.hue}, 85%, 30%)`, 1.15, true);
          this.drawPetalLayer(this.petalCount, 55, `hsl(${this.hue}, 95%, 50%)`, 1.0, false);
          this.drawPetalLayer(this.petalCount, 30, `hsl(${this.hue}, 100%, 65%)`, 0.8, false);

          ctx.shadowBlur = 0;
          const cGrad = ctx.createRadialGradient(-5, -5, 0, 0, 0, 22);
          cGrad.addColorStop(0, '#78350f');
          cGrad.addColorStop(0.7, '#451a03');
          cGrad.addColorStop(1, '#2d1102');
          ctx.beginPath();
          ctx.arc(0, 0, 22, 0, Math.PI * 2);
          ctx.fillStyle = cGrad;
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
          for (const seed of this.seeds) {
            ctx.beginPath();
            ctx.arc(Math.cos(seed.a) * seed.r, Math.sin(seed.a) * seed.r, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      drawLeaf(x, y, rot, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        const lGrad = ctx.createLinearGradient(0, 0, size, 0);
        lGrad.addColorStop(0, '#365314');
        lGrad.addColorStop(1, '#65a30d');
        ctx.fillStyle = lGrad;
        ctx.beginPath();
        ctx.ellipse(size / 2, 0, size / 2, size / 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(size, 0);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }

      drawPetalLayer(count, size, color, spread, isShadow) {
        ctx.save();
        for (let i = 0; i < count; i++) {
          ctx.rotate((Math.PI * 2) / count);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-18 * spread, -size / 2, -12 * spread, -size, 0, -size);
          ctx.bezierCurveTo(12 * spread, -size, 18 * spread, -size / 2, 0, 0);
          ctx.fillStyle = color;
          ctx.fill();

          if (!isShadow) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -size * 0.8);
            ctx.strokeStyle = 'rgba(0,0,0,0.05)';
            ctx.stroke();
          }
        }
        ctx.restore();
      }
    }

    class Star {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height * 0.6;
        this.size = Math.random() * 1.5;
        this.opacity = Math.random();
        this.blink = Math.random() * 0.02;
      }

      draw(skyAlpha) {
        this.opacity += this.blink;
        if (this.opacity > 1 || this.opacity < 0) this.blink *= -1;
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * skyAlpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Sparkle {
      constructor(x = Math.random() * width, y = Math.random() * height) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 2.5 + 1;
        this.vX = (Math.random() - 0.5) * 2;
        this.vY = (Math.random() - 0.5) * 2;
        this.life = 1;
        this.color = `hsla(${45 + Math.random() * 15}, 100%, 75%, `;
      }

      update() {
        this.x += this.vX;
        this.y += this.vY;
        this.life -= 0.012;
      }

      draw() {
        ctx.fillStyle = this.color + this.life + ')';
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'white';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      stars = Array.from({ length: 100 }, () => new Star());
    }

    function randomImage() {
      const file = imageFiles[Math.floor(Math.random() * imageFiles.length)];
      return `img/${file}`;
    }

    function spawnMemoryBubble(x, y) {
      const bubble = document.createElement('div');
      bubble.className = 'memory-bubble';
      bubble.style.left = `${x}px`;
      bubble.style.top = `${y}px`;

      const img = document.createElement('img');
      img.src = randomImage();
      img.alt = 'recuerdo floral';
      bubble.appendChild(img);
      bubbleLayer.appendChild(bubble);

      setTimeout(() => bubble.remove(), 4600);
    }

    function plantFlower(x) {
      clickCount += 1;
      flowers.push(new Flower(x));
      countEl.innerText = `Flores: ${flowers.length}`;

      quoteEl.style.opacity = 0;
      setTimeout(() => {
        quoteEl.innerText = quotes[Math.floor(Math.random() * quotes.length)];
        quoteEl.style.opacity = 1;
      }, 300);

      for (let i = 0; i < 20; i++) {
        particles.push(new Sparkle(x, height - 100));
      }

      if (clickCount % bubbleTriggerEvery === 0) {
        spawnMemoryBubble(x, height - 40);
      }
    }

    function animate(t) {
      time = t;

      const nightFactor = mouseY / height;
      const skyHue = 210;
      const skySat = 60 * nightFactor;
      const skyLight = 94 - (nightFactor * 40);
      document.body.style.background = `radial-gradient(circle at ${mouseX}px ${mouseY}px, #fffbeb 0%, hsl(${skyHue}, ${skySat}%, ${skyLight}%) 100%)`;

      ctx.clearRect(0, 0, width, height);

      if (nightFactor > 0.4) {
        stars.forEach(star => star.draw((nightFactor - 0.4) * 2));
      }

      const floorGrad = ctx.createLinearGradient(0, height - 80, 0, height);
      floorGrad.addColorStop(0, '#14532d');
      floorGrad.addColorStop(1, '#052e16');
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, height - 80, width, 80);

      flowers.forEach(flower => {
        flower.update();
        flower.draw();
      });

      if (Math.random() > 0.96) particles.push(new Sparkle());
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('mousedown', e => {
      if (e.target.tagName !== 'A' && e.target.tagName !== 'SPAN') {
        plantFlower(e.clientX);
      }
    });

    window.addEventListener('touchstart', e => {
      if (e.target.tagName !== 'A' && e.target.tagName !== 'SPAN') {
        const touchX = e.touches[0].clientX;
        plantFlower(touchX);
      }
    });

    resize();
    animate(0);
    setTimeout(() => plantFlower(width / 2), 600);
  </script>
</body>
</html>
