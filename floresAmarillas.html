<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Karina - Flores Amarillas Eternas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;500;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            transition: background 1.5s ease;
            background: #fff9e6;
        }

        #canvas {
            display: block;
            touch-action: none;
        }

        .interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.1);
            max-width: 450px;
            pointer-events: auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .music-btn {
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #facc15;
            color: #854d0e;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: 2px solid #eab308;
            pointer-events: auto;
        }

        .music-btn:hover {
            transform: scale(1.05);
            background: #fde047;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            margin: 0;
            color: #854d0e;
        }

        h3 {
            font-size: 0.9rem;
            color: #a16207;
            margin: 5px 0 0 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        p {
            color: #451a03;
            font-size: 1rem;
            line-height: 1.5;
            margin-top: 15px;
            min-height: 3.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter {
            background: rgba(254, 243, 199, 0.8);
            color: #92400e;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-block;
            margin-top: 10px;
        }

        .footer-text {
            color: #FFF;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.7;
        }

        body { cursor: crosshair; }
    </style>
</head>
<body>

    <div class="interface">
        <div class="card" id="mainCard">
            <h1>Hola Maria Alejandra...</h1>
            <h3>Se supone que hoy se dan flores, y pues usted no se puede quedar sin ellas, con la ventaja que estas flores no se marchitarán</h3>
            <p id="quote">"Haz clic en el suelo para plantar una semilla de alegría."</p>
            
            <a href="https://youtu.be/S7gMzYqXIZc?si=8XuucIOpK6e3JePk" target="_blank" class="music-btn">
                <span>🎵 Escuchar</span>
            </a>

            <div class="counter" id="flowerCount">Flores: 0</div>
        </div>
        <div class="footer-text">Toca para crear vida en tu jardín</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const quoteEl = document.getElementById('quote');
        const countEl = document.getElementById('flowerCount');

        let width, height;
        let mouseX = 0, mouseY = 0;
        let flowers = [];
        let particles = [];
        let stars = [];
        let time = 0;

        const quotes = [
            "Su merced es una excelente persona.",
            "Inteligente y sabia como ninguna otra que he conocido.",
            "Un detalle amarillo para un corazón de oro.",
            "Tiene un excelente gusto musical.",
            "Usted hace que el mundo florezca.",
            "Gracias por sacarme una sonrisa cuando mas lo he necesitado.",
            "Brillas con una luz muy bella.",
            "Su merced es magia en un mundo ordinario.",
            "Gracias por ser usted, especial, atenta y inteligente.",
            "Tu luz es capaz de iluminar el día más oscuro.",
            "Nunca dejes de brillar, el mundo la necesita.",
            "Mari su merced tiene un gusto particular con la comida y es interesante.",
            "La vida es mejor con personas como usted cerca.",
            "Un pequeño detalle para un gran corazón.",
            "Usted es pura inspiración y magia, cual es su secreto? tiene que contarmelo.",
            "NEFELIBATA es tremenda playlist, siempre la escucho todos los dias.",
            "La pandilla de Ludo es de las mejores pandillas que tengo el placer de conocer (No se crea no conozco muchas).",
            "cada que sube una historia es lindo ver lo mucho que disfruta.",
            "Dios le regalo el don de la alegria y la paz y se nota alrededor.",
            "El lado oscuro de la fuerza es fuerte en usted, pero al menos tiene galletas (sigo esperando esas galletas).",
            "Me agrada como es con su familia y lo unido que son.",
            "Su gusto musical es increible y me gustaria seguir conociendolo.",
            "Gracias por ser como es, porfa nunca cambie.",
            "Se merece lo mejor siempre, por lo magnifica persona que es usted joven.",
            "Por favor requiero que siga molestandome todos los dias, es justo y necesario.",
            "Hace falta cuando no hablo con usted, ni modo, toca reportarme todos los dias Maria Alejandra Urroz.",
            "Su obsesion por las pasas me preocupa pero asi me cae bien.",
        ];

        class Flower {
            constructor(x) {
                this.x = x;
                this.stemHeight = Math.random() * 80 + 200;
                this.currentHeight = 0;
                this.targetHeight = this.stemHeight;
                this.growthSpeed = 0.025;
                this.angle = 0;
                this.offset = Math.random() * 2000;
                this.petalCount = Math.floor(Math.random() * 3) + 14;
                this.hue = 46 + Math.random() * 8;
                this.leaves = [
                    { y: 0.4, side: 1, size: 25 + Math.random()*10 },
                    { y: 0.65, side: -1, size: 25 + Math.random()*10 }
                ];
            }

            update() {
                if (this.currentHeight < this.targetHeight) {
                    this.currentHeight += (this.targetHeight - this.currentHeight) * this.growthSpeed;
                }
                let wave = Math.sin(time * 0.001 + this.offset) * 0.12;
                let mouseFlex = (mouseX - this.x) / width * 0.25;
                this.angle = wave + mouseFlex;
            }

            draw() {
                const headX = this.x + Math.sin(this.angle) * this.currentHeight;
                const headY = (height - 80) - Math.cos(this.angle) * this.currentHeight;

                // Tallo realista
                ctx.beginPath();
                ctx.moveTo(this.x, height - 80);
                const stemGrad = ctx.createLinearGradient(this.x, height, headX, headY);
                stemGrad.addColorStop(0, '#1a2e05');
                stemGrad.addColorStop(1, '#4d7c0f');
                ctx.strokeStyle = stemGrad;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.quadraticCurveTo(this.x + (this.angle * 15), height - 80 - this.currentHeight/2, headX, headY);
                ctx.stroke();

                // Hojas detalladas
                this.leaves.forEach(leaf => {
                    const leafYRatio = leaf.y;
                    if (this.currentHeight / this.targetHeight > leafYRatio) {
                        const prog = (this.currentHeight / this.targetHeight - leafYRatio) * 4;
                        const sSize = Math.min(leaf.size, leaf.size * prog);
                        const lx = this.x + Math.sin(this.angle) * (this.currentHeight * leafYRatio);
                        const ly = (height - 80) - Math.cos(this.angle) * (this.currentHeight * leafYRatio);
                        this.drawLeaf(lx, ly, this.angle + (0.8 * leaf.side), sSize, leaf.side);
                    }
                });

                // Cabeza de la flor
                if (this.currentHeight > 50) {
                    ctx.save();
                    ctx.translate(headX, headY);
                    const headScale = (this.currentHeight / this.targetHeight);
                    ctx.scale(headScale, headScale);
                    ctx.rotate(this.angle * 0.4);

                    // Sombra proyectada
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = 'rgba(0,0,0,0.1)';

                    // Capas de pétalos
                    this.drawPetalLayer(this.petalCount, 60, `hsl(${this.hue}, 85%, 30%)`, 1.15, true);
                    this.drawPetalLayer(this.petalCount, 55, `hsl(${this.hue}, 95%, 50%)`, 1.0, false);
                    this.drawPetalLayer(this.petalCount, 30, `hsl(${this.hue}, 100%, 65%)`, 0.8, false);

                    // Centro (Disco)
                    ctx.shadowBlur = 0;
                    const cGrad = ctx.createRadialGradient(-5, -5, 0, 0, 0, 22);
                    cGrad.addColorStop(0, '#78350f');
                    cGrad.addColorStop(0.7, '#451a03');
                    cGrad.addColorStop(1, '#2d1102');
                    ctx.beginPath();
                    ctx.arc(0, 0, 22, 0, Math.PI * 2);
                    ctx.fillStyle = cGrad;
                    ctx.fill();

                    // Semillas/Textura centro
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    for(let j=0; j<25; j++) {
                        let r = Math.random() * 15;
                        let a = Math.random() * Math.PI * 2;
                        ctx.beginPath();
                        ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            drawLeaf(x, y, rot, size, side) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rot);
                const lGrad = ctx.createLinearGradient(0, 0, size, 0);
                lGrad.addColorStop(0, '#365314');
                lGrad.addColorStop(1, '#65a30d');
                ctx.fillStyle = lGrad;
                ctx.beginPath();
                ctx.ellipse(size/2, 0, size/2, size/4, 0, 0, Math.PI * 2);
                ctx.fill();
                // Nervadura central
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.lineTo(size, 0);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }

            drawPetalLayer(count, size, color, spread, isShadow) {
                ctx.save();
                for (let i = 0; i < count; i++) {
                    ctx.rotate((Math.PI * 2) / count);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-18 * spread, -size/2, -12 * spread, -size, 0, -size);
                    ctx.bezierCurveTo(12 * spread, -size, 18 * spread, -size/2, 0, 0);
                    ctx.fillStyle = color;
                    ctx.fill();
                    
                    if (!isShadow) {
                        // Vena del pétalo
                        ctx.beginPath();
                        ctx.moveTo(0,0);
                        ctx.lineTo(0, -size * 0.8);
                        ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.6;
                this.size = Math.random() * 1.5;
                this.opacity = Math.random();
                this.blink = Math.random() * 0.02;
            }
            draw(skyAlpha) {
                this.opacity += this.blink;
                if (this.opacity > 1 || this.opacity < 0) this.blink *= -1;
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * skyAlpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Sparkle {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.size = Math.random() * 2.5 + 1;
                this.vX = (Math.random() - 0.5) * 2;
                this.vY = (Math.random() - 0.5) * 2;
                this.life = 1;
                this.color = `hsla(${45 + Math.random()*15}, 100%, 75%, `;
            }
            update() {
                this.x += this.vX;
                this.y += this.vY;
                this.life -= 0.012;
            }
            draw() {
                ctx.fillStyle = this.color + this.life + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'white';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            stars = Array.from({length: 100}, () => new Star());
        }

        function plantFlower(x) {
            flowers.push(new Flower(x));
            countEl.innerText = `Flores: ${flowers.length}`;
            
            quoteEl.style.opacity = 0;
            setTimeout(() => {
                quoteEl.innerText = quotes[Math.floor(Math.random() * quotes.length)];
                quoteEl.style.opacity = 1;
            }, 300);

            for(let i=0; i<20; i++) {
                particles.push(new Sparkle(x, height - 100));
            }
        }

        function animate(t) {
            time = t;
            
            // Fondo dinámico (Dia a Noche suave)
            const nightFactor = mouseY / height;
            const skyHue = 210;
            const skySat = 60 * nightFactor;
            const skyLight = 94 - (nightFactor * 40);
            document.body.style.background = `radial-gradient(circle at ${mouseX}px ${mouseY}px, #fffbeb 0%, hsl(${skyHue}, ${skySat}%, ${skyLight}%) 100%)`;

            ctx.clearRect(0, 0, width, height);

            // Estrellas (solo visibles si está "oscuro")
            if (nightFactor > 0.4) {
                stars.forEach(s => s.draw((nightFactor - 0.4) * 2));
            }

            // Suelo
            const floorGrad = ctx.createLinearGradient(0, height-80, 0, height);
            floorGrad.addColorStop(0, '#14532d');
            floorGrad.addColorStop(1, '#052e16');
            ctx.fillStyle = floorGrad;
            ctx.beginPath();
            ctx.rect(0, height-80, width, 80);
            ctx.fill();

            flowers.forEach(f => {
                f.update();
                f.draw();
            });

            if (Math.random() > 0.96) particles.push(new Sparkle());
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => { 
            mouseX = e.clientX; 
            mouseY = e.clientY; 
        });
        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'A' && e.target.tagName !== 'SPAN') {
                plantFlower(e.clientX);
            }
        });
        window.addEventListener('touchstart', e => {
            if (e.target.tagName !== 'A' && e.target.tagName !== 'SPAN') {
                const touchX = e.touches[0].clientX;
                plantFlower(touchX);
            }
        });

        resize();
        animate(0);
        setTimeout(() => plantFlower(width/2), 600);
    </script>
</body>
</html>
